<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>15 August Nostalgia</title>
    <meta
      name="description"
      content="Before fancy functions. You once stood in the school maidan. White uniforms. Girls dancing. The whole village watching."
    />
    <meta name="theme-color" content="#FF9933" />
    <meta name="keywords" content="15 August, Independence Day, nostalgia, tiranga, school function, India" />
    <link rel="canonical" href="https://15-august-nostalgia.vercel.app/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="15 August Nostalgia" />
    <meta property="og:title" content="15 August Nostalgia" />
    <meta
      property="og:description"
      content="Before fancy functions. You once stood in the school maidan."
    />
    <meta property="og:url" content="https://15-august-nostalgia.vercel.app/" />
    <meta property="og:image" content="https://15-august-nostalgia.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1376" />
    <meta property="og:image:height" content="768" />
    <meta property="og:image:alt" content="15 अगस्त school function nostalgia" />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="15 August Nostalgia" />
    <meta
      name="twitter:description"
      content="Before fancy functions. You once stood in the school maidan."
    />
    <meta name="twitter:image" content="https://15-august-nostalgia.vercel.app/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Tiro+Devanagari+Hindi:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="fx" aria-hidden="true">
      <filter id="breeze" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.007 0.02"
          numOctaves="2"
          seed="3"
          result="noise"
        >
          <animate
            attributeName="baseFrequency"
            dur="14s"
            values="0.006 0.016;0.011 0.028;0.006 0.016"
            repeatCount="indefinite"
          />
        </feTurbulence>
        <feDisplacementMap
          in="SourceGraphic"
          in2="noise"
          scale="6"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>

    <div class="hero" aria-hidden="true">
      <div class="slide is-on is-photo" data-slot="a">
        <img class="hero-still" src="intro.jpeg" alt="" />
        <img class="hero-wind" src="intro.jpeg" alt="" />
      </div>
      <div class="slide" data-slot="b">
        <img class="hero-still" src="intro.jpeg" alt="" />
        <img class="hero-wind" src="intro.jpeg" alt="" />
      </div>
      <div class="hero-shade"></div>
    </div>

    <header class="topbar">
      <time id="clock" class="clock">—</time>
      <div class="top-actions">
        <div class="online" aria-live="polite">
          <span class="dot"></span>
          <span id="online-count">—</span>
          <span class="muted">in the maidan</span>
        </div>
        <button id="share" type="button" class="share" aria-label="Share">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
            <path d="M8.6 13.5 15.4 17.5M15.4 6.5 8.6 10.5" />
          </svg>
          <span>Share</span>
        </button>
      </div>
    </header>

    <main>
      <section class="title-block">
        <h1 class="sr-only">स्कूल मैदान — 15 August</h1>
      </section>

      <section class="player" aria-label="Patriotic playlist">
        <div id="yt" class="yt"></div>

        <div class="glass">
          <img id="cover" class="cover" alt="" />
          <div class="meta">
            <p id="scene" class="scene"></p>
            <p id="track-title" class="track-title"></p>
            <p id="track-artist" class="track-artist"></p>
            <input
              id="seek"
              class="seek"
              type="range"
              min="0"
              max="100"
              value="0"
              step="0.1"
              aria-label="Seek"
            />
          </div>
          <div class="controls">
            <button id="prev" type="button" aria-label="Previous">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" />
              </svg>
            </button>
            <button id="play" type="button" class="play" aria-label="Play">
              <svg id="icon-play" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                <path d="M8 5v14l11-7z" />
              </svg>
              <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                <path d="M6 5h4v14H6zm8 0h4v14h-4z" />
              </svg>
            </button>
            <button id="next" type="button" aria-label="Next">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z" />
              </svg>
            </button>
          </div>
        </div>
      </section>
    </main>

    <p class="credit">
      songs play via YouTube. this is a memory, not a concert.
    </p>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js"></script>
  </body>
</html>
